name: bible_updater
description: >-
  Installateur / launcher / auto-updater silencieux de Bible desktop
  (Windows, Linux & macOS). Récupère la dernière release GitHub, gère un layout
  versionné à base de liens (jonction Windows / symlink Linux & macOS) et lance
  l'app.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.13.0

dependencies:
  args: ^2.5.0
  path: ^1.9.0
  archive: ^3.6.1
